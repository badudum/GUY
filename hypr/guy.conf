# GUY for Hyprland's classic config. Load it from hyprland.conf with:
#   source = ~/.config/hypr/guy.conf

# the liquid-glass island: GUY animates itself, so Hyprland only blurs behind the glass
layerrule = blur, guy
layerrule = ignorealpha 0.5, guy
layerrule = noanim, guy
# the invisible click-catcher behind Ask GUY
layerrule = noanim, guy-catcher

bind = ALT, SPACE, exec, ~/.local/bin/guy --ask
bind = SUPER, SPACE, exec, ~/.local/bin/guy --listen

# start GUY (and its voice) as systemd user services, so `systemctl --user restart guy` works
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start guy.service; systemctl --user start guy-voice.service
